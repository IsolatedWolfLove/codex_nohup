name: Build tagged releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
      - run: npm ci
      - run: npm test
      - run: npm run build

  package:
    name: Package ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
            artifact: nohop-codex-linux
            path: release/*.AppImage
          - runner: windows-latest
            target: windows
            artifact: nohop-codex-windows
            path: release/*.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
      - run: npm ci
      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/set-release-version.mjs
      - name: Build Windows ConPTY agent
        run: npm run agent:win
      - name: Package application
        run: npm run package:${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30
